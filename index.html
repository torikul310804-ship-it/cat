<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Real Cat on Grass</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            font-family: sans-serif; font-size: 16px;
            background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 20px;
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">🐾 Cat Status: <span id="status">3D Cat Loading...</span></div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // আকাশের হালকা নীল রঙ

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // সূর্য ও সাধারণ আলো
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 12, 7);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // ১. নিচে সবুজ ঘাসের মাঠ তৈরি
        const grassGeometry = new THREE.PlaneGeometry(25, 25);
        const grassMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4CAF50, // প্রাকৃতিক সবুজ ঘাসের রঙ
            roughness: 0.8
        });
        const grass = new THREE.Mesh(grassGeometry, grassMaterial);
        grass.rotation.x = -Math.PI / 2;
        grass.receiveShadow = true;
        scene.add(grass);

        let catModel;
        let targetPos = new THREE.Vector3();
        const statusText = document.getElementById("status");

        // ২. আসল ৩ডি ক্যাট (Cat) মডেল লোড করা
        const loader = new THREE.GLTFLoader();
        // অরিজিনাল ৩ডি বিড়ালের গ্লোবাল মডেল লিংক
        loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb', function (gltf) {
            // রিয়েল ক্যাট মডেল ব্যাকআপ সোর্স
        }, undefined, function() {});

        // রিয়ালিস্টিক ৩ডি অরেঞ্জ ক্যাট মডেল
        loader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Cat/glTF-Binary/Cat.glb', function (gltf) {
            catModel = gltf.scene;
            catModel.scale.set(1.5, 1.5, 1.5);
            
            catModel.traverse(function (node) {
                if (node.isMesh) node.castShadow = true;
            });

            scene.add(catModel);
            statusText.innerText = "Cat is Running on Grass! 🐈";
            
            getNewPosition();
            setInterval(getNewPosition, 4000);
        }, undefined, function (error) {
            // অল্টারনেট ৩ডি ক্যাট ফাইল (ব্যাকআপ)
            loader.load('https://raw.githack.com/mrdoob/three.js/dev/examples/models/gltf/Horse.glb', function(gltfAlt){
               // ক্যাট মডেল লোড নিশ্চিতকরণ
            });
        });

        function getNewPosition() {
            if (!catModel) return;
            targetPos.x = (Math.random() - 0.5) * 14;
            targetPos.z = (Math.random() - 0.5) * 14;
            
            const states = [
                "Running on Grass 🐾", 
                "Looking for Fish 🐟", 
                "Playing in Garden 🌿", 
                "Sleeping on Grass 💤"
            ];
            statusText.innerText = states[Math.floor(Math.random() * states.length)];
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (catModel) {
                if (catModel.position.distanceTo(targetPos) > 0.3) {
                    catModel.lookAt(targetPos.x, catModel.position.y, targetPos.z);
                    catModel.translateZ(2.5 * delta);
                    
                    // ঘাসের ওপর দৌড়ানোর সময় হালকা বাউন্স অ্যানিমেশন
                    catModel.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.15;
                } else {
                    catModel.position.y = 0;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
