<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Auto Endless Cat Run</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            font-family: sans-serif; font-size: 16px;
            background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 20px;
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">🐾 Cat Status: <span id="status">Running...</span></div>

    <script>
        // ১. থ্রিডি সিন ও ক্যামেরা সেটআপ
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // আলো (Lighting)
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // ২. ম্যাপ তৈরি (সবুজ মাঠ)
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
        const grass = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), grassMat);
        grass.rotation.x = -Math.PI / 2;
        scene.add(grass);

        // পরিবর্তনশীল রঙের রাস্তা (Road)
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.8 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 60), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        scene.add(road);

        // ৩. বিড়ালের মডেল তৈরি
        const catGroup = new THREE.Group();
        
        // উপাদান ও রঙ
        const catMat = new THREE.MeshStandardMaterial({ color: 0xFF9800 }); // মূল রঙ: কমলা
        
        // শরীর
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.4), catMat);
        body.position.y = 0.5;
        catGroup.add(body);

        // মাথা (যা ঘাড় ঘোরাবে)
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 0.8, 0.6);
        
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.5), catMat);
        headGroup.add(head);

        // কান
        const earMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const earL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.15), earMat);
        earL.position.set(-0.2, 0.35, 0);
        headGroup.add(earL);

        const earR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.15), earMat);
        earR.position.set(0.2, 0.35, 0);
        headGroup.add(earR);

        catGroup.add(headGroup);

        // লেজ
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), catMat);
        tail.position.set(0, 0.6, -0.8);
        tail.rotation.x = 0.3;
        catGroup.add(tail);

        scene.add(catGroup);

        // ৪. লজিক ও অ্যানিমেশন ভ্যারিয়েবল
        const colors = [0xFF9800, 0xE91E63, 0x9C27B0, 0x2196F3, 0x009688, 0xFFEB3B, 0xFF5722];
        const roadColors = [0x795548, 0x424242, 0x3F51B5, 0x00695C, 0x8D6E63];
        
        let isLookingAround = false;
        let catSpeed = 0.1;
        const statusText = document.getElementById("status");

        // ৫. টাইমার দিয়ে রঙ বদল ও ঘাড় ঘোরানোর ইভেন্ট
        
        // বিড়ালের রঙ পরিবর্তন (প্রতি ৪ সেকেন্ডে)
        setInterval(() => {
            const randomCatColor = colors[Math.floor(Math.random() * colors.length)];
            catMat.color.setHex(randomCatColor);
        }, 4000);

        // রাস্তার রঙ পরিবর্তন (প্রতি ৬ সেকেন্ডে)
        setInterval(() => {
            const randomRoadColor = roadColors[Math.floor(Math.random() * roadColors.length)];
            roadMat.color.setHex(randomRoadColor);
        }, 6000);

        // ঘাড় ঘুরিয়ে তাকানো (প্রতি ৫ সেকেন্ডে)
        setInterval(() => {
            if (!isLookingAround) {
                isLookingAround = true;
                statusText.innerText = "Looking around... 👀";
                
                // মাথা ঘোরানো
                headGroup.rotation.y = Math.PI / 2; 

                setTimeout(() => {
                    headGroup.rotation.y = 0; // আবার সোজা করা
                    isLookingAround = false;
                    statusText.innerText = "Running... 🐾";
                }, 1500); // ১.৫ সেকেন্ড তাকিয়ে থাকবে
            }
        }, 5000);

        // ৬. মূল অ্যানিমেশন লুপ
        function animate() {
            requestAnimationFrame(animate);

            if (!isLookingAround) {
                // সামনে দৌড়ানো
                catGroup.position.z += catSpeed;

                // দৌড়ানোর লাফানো অ্যানিমেশন
                catGroup.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.2;
                tail.rotation.z = Math.sin(Date.now() * 0.01) * 0.3; // লেজ নাড়ানো

                // ম্যাপের শেষে গেলে আবার শুরুতে ফিরে আসা (অনবরত চলার জন্য)
                if (catGroup.position.z > 25) {
                    catGroup.position.z = -25;
                }
            } else {
                catGroup.position.y = 0; // থামলে মাটিতে থাকবে
            }

            // ক্যামেরা বিড়ালের পেছনে ফলো করবে
            camera.position.z = catGroup.position.z + 8;
            camera.position.x = catGroup.position.x;
            camera.lookAt(catGroup.position);

            renderer.render(scene, camera);
        }

        animate();

        // স্ক্রিন রিসাইজ সাপোর্ট
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
